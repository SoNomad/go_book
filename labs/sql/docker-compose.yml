# Учебная база данных для главы 7.
#
#   docker compose up -d                          — поднять PostgreSQL (схема и данные загрузятся сами)
#   docker compose exec db psql -U study -d shop  — открыть psql внутри контейнера
#   docker compose down -v                        — удалить контейнер И данные (сброс к исходному состоянию)
#
# Подключение снаружи (DBeaver, Go-код): postgres://study:study@localhost:5432/shop?sslmode=disable
# Если порт 5432 у вас занят — поменяйте левую часть на 5433:5432.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: study
      POSTGRES_PASSWORD: study
      POSTGRES_DB: shop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # *.sql из этой папки выполняются ТОЛЬКО при первом создании тома, по алфавиту
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study -d shop"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
